<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas</title>
<meta name="theme-color" content="#1A1A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1A1A1A; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #E9E6DF; }
  #splash { position: fixed; inset: 0; z-index: 2; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .25s; }
  #splash.fuera { opacity: 0; pointer-events: none; }
  #splash img { width: 132px; height: 132px; }
  #splash .txt { font-size: 15px; color: #6B665C; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #D5D1C8; border-top-color: #446FB7; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #ayuda { display: none; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 0 24px; }
  #ayuda.ver { display: flex; }
  #ayuda a { display: inline-block; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 11px 18px; border-radius: 8px; }
  #ayuda small { color: #8A857B; }
</style>
</head>
<body>
<div id="splash" role="status">
  <img src="icono-192.png" alt="FG Equipamiento">
  <div class="spin" id="spin"></div>
  <div class="txt" id="txt">Cargando Tareas…</div>
  <div id="ayuda">
    <span>Está tardando más de lo normal. Revisá que el celular tenga internet.</span>
    <a id="abrir" href="#" target="_blank" rel="noopener">Abrir en el navegador</a>
    <small>o cerrá y volvé a abrir la app</small>
  </div>
</div>
<iframe id="app" title="Tareas Semanales" allow="clipboard-write; fullscreen"></iframe>
<script>
(function () {
  // Enlace de la app web de Tareas Semanales (Apps Script). Si se crea una implementación nueva, cambiarlo acá.
  var APP = 'https://script.google.com/macros/s/AKfycbxHPrJtNUbrzIOxYdsqTPrmjHWakrsCDF1fjZ4Bq0X-lpqBZS_VvoCAV_SsXM9yEDu4RQ/exec';
  // ?vista=cronograma | mis-tareas | fabrica  (accesos directos del ícono)
  var vista = (new URLSearchParams(location.search).get('vista') || '').replace(/[^a-z-]/g, '');
  var url = APP + (vista ? '?vista=' + encodeURIComponent(vista) : '');
  var app = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('abrir').href = url;
  var listo = false;
  app.addEventListener('load', function () {
    listo = true;
    setTimeout(function () { splash.classList.add('fuera'); }, 400);
  });
  app.src = url;
  setTimeout(function () {
    if (listo) return;
    document.getElementById('spin').style.display = 'none';
    document.getElementById('txt').style.display = 'none';
    document.getElementById('ayuda').classList.add('ver');
  }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
